<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="轻账单">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>轻账单 · 个人记账</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo"><span class="logo-icon">🧾</span>轻账单</div>
    <nav class="nav">
      <button class="nav-item" data-route="/home"><span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></span><span>首页</span></button>
      <button class="nav-item" data-route="/accounts"><span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M15 15h3"/></svg></span><span>账户</span></button>
      <button class="nav-item" data-route="/stats"><span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-8"/><path d="M22 20H2"/></svg></span><span>统计</span></button>
      <button class="nav-item" data-route="/calendar"><span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg></span><span>日历</span></button>
      <button class="nav-item" data-route="/settings"><span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></span><span>设置</span></button>
    </nav>
    <div class="sidebar-foot">轻账单 v1.79.0<br>数据仅保存在本地浏览器</div>
  </aside>
  <main id="view" class="view"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<noscript><div style="padding:40px;text-align:center">轻账单需要启用 JavaScript 才能使用。</div></noscript>
<script src="js/preset.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script>
  /* PWA：Service Worker 仅在 HTTP(S) 环境下生效（file:// 打开时自动跳过） */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 忽略注册失败 */ });
    });
  }
</script>
</body>
</html>
